<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logros, formación y actividades | Tania Karina Alemán Díaz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--soft:#EEF4FB;--card:#FFFFFF;--line:#C3D6EC;--head:#03224F;--text:#56657F;
--n900:#03224F;--n700:#03224F;--n500:#1A4B91;--teal:#14B8A6;--shadow:0 6px 20px rgba(26,75,145,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:#FFFFFF}
body{margin:0;background:#FFFFFF;color:var(--text);font:400 14px/1.6 "Poppins",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{width:100%;max-width:1280px;margin:0 auto;padding:16px 12px 20px}
section{width:100%;margin-bottom:28px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;max-width:100%;margin:0 auto 16px;padding:12px 26px;border-radius:14px;color:#fff;font-size:16px;font-weight:700;line-height:1.3;background:linear-gradient(180deg,var(--n900),var(--n500));box-shadow:0 6px 16px rgba(3,34,79,.28)}
.pill svg{width:22px;height:22px;flex:none;color:var(--teal)}
.grid{display:grid;gap:14px;align-items:start;grid-template-columns:1fr}
.grid:has(>:only-child){grid-template-columns:1fr;max-width:420px;margin:0 auto}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.badge{display:grid;place-items:center}
.badge img{display:block;width:auto;height:64px;max-width:100%;object-fit:contain}
.card h3{margin:4px 0 0;color:var(--head);font-size:16px;font-weight:700;line-height:1.35}
.card p{margin:0;font-size:14px;font-weight:400}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--head);font-size:14px;font-weight:500}
.ipa{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(124,108,240,.12);border:1px solid rgba(124,108,240,.5);color:#4A3BBD;font-style:italic}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;white-space:nowrap;border-radius:12px;font:600 14px/1.2 "Poppins",system-ui,sans-serif;color:#fff;text-decoration:none;background:linear-gradient(180deg,var(--n700),var(--n500));box-shadow:0 4px 12px rgba(26,75,145,.3);transition:transform .15s}
.btns{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:16px;height:16px}
.btn[aria-disabled="true"]{background:var(--soft);color:var(--text);border:1px dashed var(--line);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px){main{padding:24px 20px 28px}}
@media(min-width:1100px){main{padding:28px 32px 32px}.grid{gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-award" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/></symbol>
<symbol id="i-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0zM22 10v6M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
</defs>
</svg>

<main>
  <section aria-labelledby="t-logros">
    <h2 class="pill" id="t-logros"><svg><use href="#i-award"/></svg>Logros académicos</h2>
    <div class="grid" id="logros"></div>
  </section>
  <section aria-labelledby="t-extra">
    <h2 class="pill" id="t-extra"><svg><use href="#i-users"/></svg>Actividades extracurriculares</h2>
    <div class="grid" id="extra"></div>
  </section>
  <section aria-labelledby="t-form">
    <h2 class="pill" id="t-form"><svg><use href="#i-cap"/></svg>Formación complementaria</h2>
    <div class="grid" id="formacion"></div>
  </section>
</main>

<script>
/* ===== ENLACES A LOS CERTIFICADOS (GitHub) =====
   Repositorio: portafolio · carpeta: certificados
   Si el enlace está vacío, el botón muestra "Certificado próximamente". */
var BASE = "https://karinaaleman549-pixel.github.io/portafolio/certificados/";
var CERTS = {
  fonetica2025: BASE + "logros/2025-fonetica-primer-lugar.pdf",
  basico: BASE + "formacion/ingles-basico-cetec-plus.pdf",
  intermedio: BASE + "formacion/ingles-intermedio-cetec-plus.pdf",
  operador_cetec: BASE + "formacion/operador-microcomputadora-cetec-plus.pdf",
  operador_inatec: BASE + "formacion/operador-microcomputadora-inatec.pdf",
  excel: BASE + "formacion/excel-avanzado-cetec-plus.pdf",
  creando: BASE + "extracurriculares/2016-creando-oportunidades.pdf"
};

var LOGOS = {
  unan: BASE + "escudo_unan_sin_fondo.png",
  cetec: BASE + "cetec-plus-logo.png",
  educo: BASE + "educo-logo.png",
  inatec: BASE + "inatec-logo.png"
};

var logros = [
  {k:"fonetica2025", logo:LOGOS.unan, la:"Logo de la UNAN-León", t:"Primer lugar, Concurso de Fonética", s:"UNAN-León, CUR Jinotega", m:"XI Festival de Inglés · Noviembre 2025", ipa:"/fɜːst pleɪs/"}
];
var formacion = [
  {k:"basico", logo:LOGOS.cetec, la:"Logo de CETEC-PLUS", t:"Inglés, nivel básico", s:"CETEC-PLUS", m:"2020"},
  {k:"intermedio", logo:LOGOS.cetec, la:"Logo de CETEC-PLUS", t:"Inglés, nivel intermedio", s:"CETEC-PLUS", m:"2022"},
  {k:["operador_cetec","operador_inatec"], lab:["Certificado CETEC-PLUS","Certificado INATEC"], ins:[null,{logo:LOGOS.inatec,alt:"Logo de INATEC",name:"Tecnológico Nacional",m:"2019–2020"}], logo:LOGOS.cetec, la:"Logo de CETEC-PLUS", t:"Operador de microcomputadora", s:"CETEC-PLUS", m:"2019–2020"},
  {k:"excel", logo:LOGOS.cetec, la:"Logo de CETEC-PLUS", t:"Excel avanzado", s:"CETEC-PLUS", m:"2022"}
];
var extra = [
  {k:"creando", logo:LOGOS.educo, la:"Logo de EDUCO", t:"Proyecto “Creando oportunidades”", s:"CESESMA & EDUCO", m:"2016", d:"Participación en actividades educativas para la prevención de la violencia basada en género."}
];

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function one(k,label){
  var u = CERTS[k];
  if(u) return '<a class="btn" href="'+encodeURI(u)+'" target="_blank" rel="noopener noreferrer"><svg><use href="#i-link"/></svg>'+label+'</a>';
  return '<span class="btn" aria-disabled="true">Certificado próximamente</span>';
}
function logo(src,alt){
  return '<div class="badge"><img src="'+src+'" alt="'+esc(alt)+'" onerror="this.parentNode.style.display=\'none\'"></div>';
}
function chip(x){return '<span class="chip">'+esc(x)+'</span>'}
function btn(o){
  if(Array.isArray(o.k)) return '<div class="btns">'+o.k.map(function(k,i){
    var n=o.ins[i];
    return (n?logo(n.logo,n.alt)+'<p>'+esc(n.name)+'</p>'+chip(n.m):'')+one(k,o.lab[i]);
  }).join("")+'</div>';
  return one(o.k,"Ver certificado");
}
function card(o){
  return '<article class="card"><h3>'+esc(o.t)+'</h3>'
    +logo(o.logo,o.la)
    +(o.s?'<p>'+esc(o.s)+'</p>':'')
    +(o.m?chip(o.m):'')
    +(o.d?'<p>'+esc(o.d)+'</p>':'')
    +(o.ipa?'<p class="ipa">'+esc(o.ipa)+'</p>':'')
    +btn(o)+'</article>';
}
function fill(id,arr){document.getElementById(id).innerHTML = arr.map(card).join("")}
fill("logros",logros); fill("formacion",formacion); fill("extra",extra);
</script>
</body>
</html>
