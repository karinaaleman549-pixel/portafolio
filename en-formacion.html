<script>
/* ===== ENLACES A LOS CERTIFICADOS (GitHub) =====
   Repositorio: portafolio · carpeta: certificados
   Si el enlace está vacío, el botón muestra "Certificate coming soon". */
var BASE = "certificados/";
var CERTS = {
  fonetica2025: BASE + "logros/2025-fonetica-primer-lugar.pdf",
  basico: BASE + "formacion/ingles-basico-cetec-plus.pdf",
  intermedio: BASE + "formacion/ingles-intermedio-cetec-plus.pdf",
  operador_cetec: BASE + "formacion/operador-microcomputadora-cetec-plus.pdf",
  operador_inatec: BASE + "formacion/operador-microcomputadora-inatec.pdf",
  excel: BASE + "formacion/excel-avanzado-cetec-plus.pdf",
  creando: BASE + "extracurriculares/2016-creando-oportunidades.pdf"
};

var LOGOS = {
  unan: BASE + "escudo_unan_sin_fondo.png",
  cetec: BASE + "cetec-plus-logo.png",
  educo: BASE + "educo-logo.png",
  inatec: BASE + "inatec-logo.png"
};

var logros = [
  {k:"fonetica2025", logo:LOGOS.unan, la:"UNAN-León logo", t:"First place, Phonetics Contest", s:"UNAN-León, CUR Jinotega", m:"XI English Festival · November 2025", ipa:"/fɜːst pleɪs/"}
];
var formacion = [
  {k:"basico", logo:LOGOS.cetec, la:"CETEC-PLUS logo", t:"English, basic level", s:"CETEC-PLUS", m:"2020"},
  {k:"intermedio", logo:LOGOS.cetec, la:"CETEC-PLUS logo", t:"English, intermediate level", s:"CETEC-PLUS", m:"2022"},
  {k:["operador_cetec","operador_inatec"], lab:["CETEC-PLUS certificate","INATEC certificate"], ins:[null,{logo:LOGOS.inatec,alt:"INATEC logo",name:"National Technological Institute",m:"2019–2020"}], logo:LOGOS.cetec, la:"CETEC-PLUS logo", t:"Microcomputer operator", s:"CETEC-PLUS", m:"2019–2020"},
  {k:"excel", logo:LOGOS.cetec, la:"CETEC-PLUS logo", t:"Advanced Excel", s:"CETEC-PLUS", m:"2022"}
];
var extra = [
  {k:"creando", logo:LOGOS.educo, la:"EDUCO logo", t:"Project “Creating Opportunities”", s:"CESESMA & EDUCO", m:"2016", d:"Participation in educational activities for the prevention of gender-based violence."}
];

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function one(k,label){
  var u = CERTS[k];
  if(u) return '<a class="btn" href="'+encodeURI(u)+'" target="_blank" rel="noopener noreferrer"><svg><use href="#i-link"/></svg>'+label+'</a>';
  return '<span class="btn" aria-disabled="true">Certificate coming soon</span>';
}
function logo(src,alt){
  return '<div class="badge"><img src="'+src+'" alt="'+esc(alt)+'" onerror="this.parentNode.style.display=\'none\'"></div>';
}
function chip(x){return '<span class="chip">'+esc(x)+'</span>'}
function btn(o){
  if(Array.isArray(o.k)) return '<div class="btns">'+o.k.map(function(k,i){
    var n=o.ins[i];
    return (n?logo(n.logo,n.alt)+'<p>'+esc(n.name)+'</p>'+chip(n.m):'')+one(k,o.lab[i]);
  }).join("")+'</div>';
  return one(o.k,"View certificate");
}
function card(o){
  return '<article class="card"><h3>'+esc(o.t)+'</h3>'
    +logo(o.logo,o.la)
    +(o.s?'<p>'+esc(o.s)+'</p>':'')
    +(o.m?chip(o.m):'')
    +(o.d?'<p>'+esc(o.d)+'</p>':'')
    +(o.ipa?'<p class="ipa">'+esc(o.ipa)+'</p>':'')
    +btn(o)+'</article>';
}
function fill(id,arr){document.getElementById(id).innerHTML = arr.map(card).join("")}
fill("logros",logros); fill("formacion",formacion); fill("extra",extra);
</script>
