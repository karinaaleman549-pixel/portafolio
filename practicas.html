<script>
/* ===== CONFIGURACIÓN: edita solo esto ===== */
var CFG={
 user:"karinaaleman549-pixel", /* tu usuario de GitHub */
 repo:"portafolio", /* nombre del repositorio con tus PDF */
 dir:"", /* carpeta dentro del repositorio (vacío = raíz) */
 hoja:{1:"hoja-evaluación-practica-1.pdf",3:"hoja-evaluación-practica-3.pdf"}, /* nombre de cada hoja de evaluación */
 refl:{ /* reflexión de cada práctica: edita el texto entre comillas */
  1:"En la práctica I comprobé que planificar y preparar materiales consume tiempo valioso para acompañar a los estudiantes.",
  2:"En la práctica II, al observar contextos como el multigrado y la educación a distancia, confirmé que esa adaptación se repite en cada realidad.",
  3:"En la práctica III esa experiencia dio origen a una propuesta: automatizar lo operativo sin reemplazar al docente, para enseñar y acompañar más."},
 progDir:{1:"programacion-proporcionada-junio-julio-2025",3:"programacion-proporcionada"}, /* carpeta de programaciones */
 prog:{1:{"1ro":"programacion-1ro.PDF","2do":"programacion-2do.pdf","3ro":"programacion-3ro.PDF","4to":"programacion-4to.PDF","5to":"programacion-5to.PDF"},
  3:{"1ro":"programacion-1ro.PDF","2do":"programacion-2do.PDF","3ro":"programacion-3ro.pdf","4to":"programacion-4to-y-5to.PDF","5to":"programacion-4to-y-5to.PDF"}}, /* archivo de programación por año */
 inst:{1:"Colegio Público La Corona",2:"Colegio Público Augusto César Sandino, Jinotega",3:"Colegio Público La Corona"},
 fechas:{1:"1 al 4 de julio de 2025",2:"20 de abril de 2026",3:"1 al 9 de junio de 2026"},
 planes:{ /* cantidad de planes por año (3 o 4) */
  1:{"1ro":2,"2do":2,"3ro":3,"4to":1,"5to":2},
  3:{"1ro":3,"2do":3,"3ro":3,"4to":2,"5to":3}},
 comp:{3:{"4to":"4.º y 5.º año","5to":"4.º y 5.º año"}}, /* años que comparten una misma programación */
 logos:{ /* logos de los colegios: se prueba cada archivo en orden hasta que uno exista */
  corona:["logo-la-corona.jpg","practica-3/img_1.jpg"],
  sandino:["logo-augusto-c-sandino.jpg","practica-2/img_2.jpg"]},
 fotos2:[ /* fotos de la práctica II: archivo dentro de practica-2 y descripción */
  {f:"foto-1.jpg",t:"Observación en el centro educativo"},
  {f:"foto-2.jpg",t:"Con compañeras durante la práctica de observación"}]
};
/* ========================================= */
var ROM={1:"I",2:"II",3:"III"};
var DOC='<svg><use href="#d"/></svg>';
function IC(i){return '<svg aria-hidden="true"><use href="#'+i+'"/></svg>'}
function T(t,i){return '<h2 class="pill"><svg aria-hidden="true"><use href="#'+(i||'d')+'"/></svg>'+t+'</h2>'}
function dato(k,v){return '<div class="card"><h3>'+v+'</h3><p>'+k+'</p></div>'}
var OLD="foto-perfil.jpg",PV='',GH={tok:'',edit:false},tt;
function SITE(){return ''}
function BASE(){return SITE()+CFG.dir}
function PHOTO(){return CFG.dir+'foto-perfil.jpg'+PV}
function link(f){return BASE()+encodeURI(f)}
function nextLogo(i){var l=i.dataset.l.split('|'),k=+i.dataset.k+1;if(k<l.length){i.dataset.k=k;i.src=link(l[k])}else i.parentNode.style.display='none'}
function datoL(k,v,key){var l=CFG.logos[key];return '<div class="card"><h3>'+v+'</h3><div class="logo"><img alt="Logo de '+v+'" data-l="'+l.join('|')+'" data-k="0" src="'+link(l[0])+'" onerror="nextLogo(this)"></div><p>'+k+'</p></div>'}
function hero(n,t,txt,chips){
 return '<div class="navy"><div class="wrap" style="padding-top:32px;padding-bottom:36px"><p class="eyebrow">Práctica '+ROM[n]+'</p><h1 style="margin:6px 0 10px">'+t+'</h1><p style="color:#dbe8fa;max-width:62ch;margin-bottom:16px">'+txt+'</p><div class="chips">'+chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join('')+'</div></div></div>'}
function pie(n,c){
 var p=n>1?'<a class="btn" tabindex="0" role="link" data-go="'+(n==2?'1':'2')+'">← Anterior</a>':'<a class="btn" tabindex="0" role="link" data-go="">← Inicio</a>';
 var s=n<3?'<a class="btn" tabindex="0" role="link" data-go="'+(n+1)+'">Siguiente →</a>':'<a class="btn" tabindex="0" role="link" data-go="">Inicio →</a>';
 return '<div class="sec '+c+'"><div class="wrap next">'+p+s+'</div></div>'}
function refl(n,c){return '<div class="sec '+c+'"><div class="wrap">'+T('Reflexión personal','i-brain')+'<div class="card txt"><p>'+CFG.refl[n]+'</p></div></div></div>'}
function docencia(n){
 var y=0,h='';
 for(var a in CFG.planes[n]){y++;var c=CFG.planes[n][a];
  h+='<details><summary><span class="n">'+y+'º</span>'+y+'.º año <span class="mut" style="font-weight:400">· '+c+(c==1?' plan':' planes')+'</span></summary><div class="plans">';
  for(var k=1;k<=c;k++)h+='<a class="doc" target="_blank" rel="noopener" href="'+link('practica-'+n+'/'+a+'/lesson-plan-'+k+'.PDF')+'">'+DOC+'Plan '+k+'</a>';
  h+='<a class="doc alt" style="grid-column:1/-1" target="_blank" rel="noopener" href="'+link('practica-'+n+'/'+CFG.progDir[n]+'/'+((CFG.prog[n]&&CFG.prog[n][a])||('programacion-'+a+'.PDF')))+'">'+IC('i-book')+'Programación pedagógica · '+((CFG.comp[n]&&CFG.comp[n][a])||(y+'.º año'))+'</a></div></details>'}
 return hero(n,'Docencia en secundaria','Conduje clases de primero a quinto año y evidencié cada una con su plan didáctico y la evaluación del docente tutor.',['20 horas','Secundaria','1.º a 5.º año'])+
 '<div class="sec soft"><div class="wrap">'+T('Datos de la práctica','i-list')+'<div class="grid">'+datoL('Institución',CFG.inst[n],'corona')+dato('Fechas',CFG.fechas[n])+dato('Horas','20 horas')+dato('Años atendidos','1.º a 5.º')+'</div></div></div>'+
 '<div class="sec"><div class="wrap">'+T('Planes de clase por año','d')+h+'</div></div>'+
 '<div class="sec soft"><div class="wrap">'+T('Evidencia de evaluación','i-check')+'<a class="card big" target="_blank" rel="noopener" href="'+link('practica-'+n+'/'+CFG.hoja[n])+'">'+IC('i-check')+'<div><h3>Hoja de evaluación</h3><p>Entregada por el docente tutor</p></div><span class="go">Abrir →</span></a></div></div>'+refl(n,'')+pie(n,'soft')}
function obs(){
 return hero(2,'Observación en aula','Observé clases en dos niveles para comparar la gestión del aula y las estrategias de enseñanza, y desarrollé dos planes como ejercicio práctico.',['10 horas','Primaria · 5 h','Secundaria · 5 h'])+
 '<div class="sec soft"><div class="wrap">'+T('Distribución de horas','i-clock')+'<div class="bar"><span style="flex:5;background:var(--blue)">Primaria · 5 h</span><span style="flex:5;background:var(--navy)">Secundaria · 5 h</span></div><div class="grid" style="margin-top:14px">'+datoL('Centro',CFG.inst[2],'sandino')+dato('Fecha de observación',CFG.fechas[2])+'</div></div></div>'+
 '<div class="sec"><div class="wrap">'+T('Planes desarrollados como práctica','d')+'<div class="grid">'+
 '<a class="card big" target="_blank" rel="noopener" href="'+link('practica-2/lesson-primaria-multigrado.pdf')+'">'+DOC+'<div><h3>Primaria multigrado</h3><p>Plan de clase para un aula con varios grados</p></div><span class="go">Abrir →</span></a>'+
 '<a class="card big" target="_blank" rel="noopener" href="'+link('practica-2/lesson-secundaria-a-distancia.pdf')+'">'+DOC+'<div><h3>Secundaria a distancia</h3><p>Plan de clase para modalidad a distancia</p></div><span class="go">Abrir →</span></a>'+
 '</div><div class="note" style="margin-top:14px">La práctica fue de observación. Estos dos planes los desarrollé como ejercicio práctico, en contextos distintos a los de las prácticas I y III.</div></div></div>'+
 '<div class="sec soft"><div class="wrap">'+T('Evidencia de la práctica','i-filecheck')+'<div class="grid"><a class="card big" target="_blank" rel="noopener" href="'+link('practica-2/carta-solicitud.pdf')+'">'+IC('i-mail')+'<div><h3>Carta de solicitud y autorización</h3><p>Emitida por la UNAN-León al MINED de Jinotega (8 de abril de 2026), con sello de recibido y de la dirección del colegio</p></div><span class="go">Abrir →</span></a>'+
 '<a class="card big" target="_blank" rel="noopener" href="'+link('practica-2/carta-constancia.pdf')+'">'+IC('i-filecheck')+'<div><h3>Carta constancia de observación</h3><p>Emitida por el Instituto Nacional Augusto César Sandino, Jinotega (14 de abril de 2026), con firmas y sello de la dirección</p></div><span class="go">Abrir →</span></a>'+'</div></div></div>'+
 '<div class="sec"><div class="wrap">'+T('Evidencia fotográfica','i-cam')+'<div class="grid">'+CFG.fotos2.map(function(x){return '<figure class="foto"><a target="_blank" rel="noopener" href="'+link('practica-2/'+x.f)+'"><img alt="'+x.t+'" src="'+link('practica-2/'+x.f)+'" onerror="this.parentNode.classList.add(\'vacia\')"></a><figcaption>'+x.t+'</figcaption></figure>'}).join('')+'</div></div></div>'+refl(2,'soft')+pie(2,'')}
function inicio(){
 return '<div class="navy"><div class="wrap hero"><img alt="Foto de Tania Karina Alemán Díaz" src="'+PHOTO()+'" onerror="this.onerror=null;this.src=\''+OLD+'\'"><div style="display:grid;gap:10px"><h1>Tania Karina Alemán Díaz</h1><p style="font-weight:600;color:#dbe8fa">Prácticas Profesionales</p></div></div></div>'+
 '<div class="sec soft"><div class="wrap"><div class="grid g3"><div class="card stat"><b>50 horas</b><p>en aula</p></div><div class="card stat"><b>3 prácticas</b><p>docencia y observación</p></div><div class="card stat"><b>2 niveles</b><p>primaria y secundaria</p></div></div></div></div>'+
 '<div class="sec"><div class="wrap">'+T('Mi recorrido','i-route')+'<div class="bar"><span style="flex:20;background:var(--blue)">I · 20 h</span><span style="flex:10;background:var(--teal);color:var(--navy)">II · 10 h</span><span style="flex:20;background:var(--navy)">III · 20 h</span></div>'+
 '<div class="grid g3" style="margin-top:18px"><a class="card" tabindex="0" role="link" data-go="1"><span class="badge">I</span><h3>Práctica I</h3><p>Docencia en secundaria · 20 h. Planes por año y hoja de evaluación.</p></a><a class="card" tabindex="0" role="link" data-go="2"><span class="badge">II</span><h3>Práctica II</h3><p>Observación en primaria y secundaria · 10 h. Carta de solicitud y autorización.</p></a><a class="card" tabindex="0" role="link" data-go="3"><span class="badge">III</span><h3>Práctica III</h3><p>Docencia en secundaria · 20 h. Planes por año y hoja de evaluación.</p></a></div></div></div>'}
var V={"":inicio,"1":function(){return docencia(1)},"2":obs,"3":function(){return docencia(3)}};
var NAV=[["","Inicio"],["1","Práctica I"],["2","Práctica II"],["3","Práctica III"]];

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},6000)}
function decorate(){if(!GH.edit)return;
 document.querySelectorAll('#app a[href]:not([href^="http"]):not([href^="#"])').forEach(function(a){var b=document.createElement('span');b.className='up';b.setAttribute('role','button');b.tabIndex=0;b.dataset.path=CFG.dir+decodeURI(a.getAttribute('href').slice(CFG.dir.length));b.textContent='Subir';a.appendChild(b)});
 var h=document.querySelector('.hero div');if(h){var f=document.createElement('span');f.className='up';f.setAttribute('role','button');f.tabIndex=0;f.dataset.path=CFG.dir+'foto-perfil.jpg';f.textContent='Cambiar foto';h.appendChild(f)}}
function toggleEdit(){
 if(GH.edit){GH.edit=false;return render()}
 var t=GH.tok;try{t=t||localStorage.getItem('tk')||''}catch(e){}
 t=t||prompt('Pega tu token de GitHub (solo se guarda en este dispositivo):');
 if(!t)return;GH.tok=t.trim();try{localStorage.setItem('tk',GH.tok)}catch(e){}
 GH.edit=true;render();toast('Modo edición activo: toca "Subir" junto a cada archivo')}
function pick(path){var i=document.createElement('input');i.type='file';i.accept=/\.pdf$/.test(path)?'application/pdf':'image/*';i.onchange=function(){if(i.files[0])send(path,i.files[0])};i.click()}
function send(path,f){
 if(f.size>25e6)return toast('El archivo pesa más de 25 MB');
 toast('Subiendo '+path+'…');
 var r=new FileReader();r.onload=function(){
  var api='https://api.github.com/repos/'+CFG.user+'/'+CFG.repo+'/contents/'+path,H={Authorization:'Bearer '+GH.tok,Accept:'application/vnd.github+json'};
  fetch(api,{headers:H}).then(function(x){return x.ok?x.json():{}}).then(function(j){return fetch(api,{method:'PUT',headers:H,body:JSON.stringify({message:'Subir '+path,content:r.result.split(',')[1],sha:j.sha})})})
  .then(function(x){if(!x.ok)throw 0;toast('Listo: '+path+' actualizado. Puede tardar 1 minuto en verse.');if(path===CFG.dir+'foto-perfil.jpg'){PV='?v='+Date.now();render()}})
  .catch(function(){toast('No se pudo subir. Revisa el token, el usuario y el repositorio.')})};
 r.readAsDataURL(f)}
var cur='';
function go(r){cur=V[r]?r:'';render()}
function render(){var r=cur;
 document.getElementById('app').innerHTML='<div class="view on">'+V[r]()+'</div>';
 document.getElementById('nav').innerHTML=NAV.map(function(x){return '<a tabindex="0" role="link" data-go="'+x[0]+'"'+(x[0]===r?' class="on" aria-current="page"':'')+'>'+x[1]+'</a>'}).join('');
 decorate();document.getElementById('ed').textContent=GH.edit?'Salir del modo edición':'Modo edición';window.scrollTo(0,0)}
document.addEventListener('click',function(e){
 if(e.target.id==='ed')return toggleEdit();
 var u=e.target.closest('.up');if(u){e.preventDefault();e.stopPropagation();return pick(u.dataset.path)}
 var t=e.target.closest('[data-go]');if(t)go(t.dataset.go)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var u=e.target.closest&&e.target.closest('.up');if(u){e.preventDefault();return pick(u.dataset.path)}var t=e.target.closest&&e.target.closest('[data-go]');if(t)go(t.dataset.go)}});
render();
</script>
<script>if(/[?&]editar(=|&|$)/.test(location.search)){var ed=document.getElementById("ed");if(ed)ed.style.display="inline-block"}</script>
<script src="site.js" defer></script>
</body>
</html>
